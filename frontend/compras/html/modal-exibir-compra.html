<div class="detalhes-compra">
    <p><strong>Data da compra:</strong> <span id="compra-data-exibicao"></span></p>
    <div class="compra-tabela-container">
        <table class="compra-tabela">
            <thead>
            <tr>
                <th scope="col">Produto</th>
                <th scope="col">Quantidade</th>
                <th scope="col">Unitário</th>
                <th scope="col">Total</th>
            </tr>
            </thead>
            <tbody id="compra-itens-exibicao"></tbody>
        </table>
    </div>
    <p class="total-compra">Valor Total: <strong id="compra-total-exibicao"></strong></p>
    <p><strong>Observação:</strong></p>
    <p class="observacao" id="compra-observacao-exibicao"></p>
    <div class="compra-modal-acoes">
        <button type="button" class="btn btn-secundario" id="fechar-exibicao-compra">Fechar</button>
        <button type="button" class="btn btn-primario" id="editar-exibicao-compra">Editar compra</button>
    </div>
</div>
