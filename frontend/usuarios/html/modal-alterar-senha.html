<form id="form-senha-usuario">
    <div class="campos-senha-usuario">
        <div>
            <label for="usuario-senha-atual">Senha atual:</label>
            <input id="usuario-senha-atual" type="password" autocomplete="current-password" required>
        </div>
        <div>
            <label for="usuario-nova-senha">Nova senha:</label>
            <input id="usuario-nova-senha" type="password" autocomplete="new-password" required>
        </div>
        <div>
            <label for="usuario-confirmar-senha">Confirmar nova senha:</label>
            <input id="usuario-confirmar-senha" type="password" autocomplete="new-password" required>
        </div>
    </div>
    <div class="acoes-modal-usuario">
        <button type="button" class="btn btn-secundario" id="usuario-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-primario">Alterar senha</button>
    </div>
</form>
