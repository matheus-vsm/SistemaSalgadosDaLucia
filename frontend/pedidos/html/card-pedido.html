<article class="card-pedido">
    <div class="card-pedido-corpo">
        <h3 class="pedido-numero-card"></h3>
        <p class="pedido-status-card"><strong></strong></p>
        <p><strong>Cliente:</strong> <span class="pedido-cliente-card"></span></p>
        <ul class="card-pedido-itens"></ul>
        <p><strong>Valor total:</strong> <span class="pedido-total-card"></span></p>
        <p><strong>Pagamento:</strong> <span class="pedido-pagamento-card"></span></p>
        <p><strong class="pedido-entrega-rotulo-card"></strong> <span class="pedido-entrega-card"></span></p>
        <p class="card-pedido-data"></p>
    </div>
    <div class="card-pedido-acoes">
        <button type="button" class="btn btn-secundario" data-acao-pedido="editar">Editar</button>
        <button type="button" class="btn btn-secundario" data-acao-pedido="exibir">Exibir</button>
        <button type="button" class="btn btn-secundario" data-acao-pedido="status">Alterar status</button>
    </div>
</article>
