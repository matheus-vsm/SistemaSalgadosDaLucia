<h1>Área de Salgados</h1>

<section>
    <div class="salgados-cabecalho">
        <h2>Salgados Cadastrados</h2>
        <div class="filtro-salgados" role="group" aria-label="Filtrar salgados por situação">
            <button type="button" id="btn-salgados-ativos" class="btn-salgados ativo-selecionado" aria-pressed="true">Ativos</button>
            <button type="button" id="btn-salgados-inativos" class="btn-salgados" aria-pressed="false">Inativos</button>
        </div>
    </div>
    <form id="form-busca-salgados" class="busca-salgados">
        <input type="search" id="busca-salgados" placeholder="Buscar por nome" aria-label="Buscar salgado por nome">
        <button type="submit">Buscar</button>
    </form>
    <div class="container">
        <div id="lista-salgados">
            <div class="estado" id="estado-inicial-salgados">Carregando salgados...</div>
        </div>
    </div>

    <div id="paginacao-salgados" class="paginacao">
        <button id="btn-anterior-salgados">Anterior</button>
        <span id="pagina-atual-salgados"></span>
        <button id="btn-proximo-salgados">Próximo</button>
    </div>

    <hr>
</section>

<section>
    <h2>Cadastro de Salgado</h2>
    <form id="form-salgado">
        <fieldset>
            <div class="salgado-grid">
                <div class="salgado-coluna">
                    <label for="nome-salgado">Nome:</label>
                    <input type="text" id="nome-salgado" name="nome" required>

                    <label for="descricao-salgado">Descrição:</label>
                    <textarea id="descricao-salgado" name="descricao" required></textarea>

                    <label for="categoria-salgado">Categoria:</label>
                    <select id="categoria-salgado" name="categoria" required>
                        <option value="">Selecione</option>
                    </select>

                    <label for="preco-congelado-salgado">Preço do cento congelado:</label>
                    <input type="number" id="preco-congelado-salgado" name="precoCentoCongelado" min="0" step="0.01" required>

                    <label for="preco-processado-salgado">Preço do cento processado (frito/assado):</label>
                    <input type="number" id="preco-processado-salgado" name="precoCentoProcessado" min="0" step="0.01" required>
                </div>

                <div class="salgado-coluna imagem-coluna">
                    <label for="imagem-salgado">Imagem:</label>
                    <label for="imagem-salgado" class="campo-selecao-imagem">
                        <img id="imagem-preview-salgado" class="imagem-salgado hidden" alt="Prévia da imagem selecionada">
                        <span id="texto-selecao-imagem">Selecione a Imagem</span>
                    </label>
                    <span id="nome-arquivo-imagem" class="nome-arquivo-imagem"></span>
                    <input type="file" id="imagem-salgado" class="input-imagem" name="imagem" accept="image/*">
                </div>
            </div>
        </fieldset>
        <br>

        <button type="submit">Cadastrar Salgado</button>
    </form>
</section>
