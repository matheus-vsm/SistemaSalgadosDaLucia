<h1>Área de Salgados</h1>

<section>
    <div class="salgados-cabecalho">
        <h2>Salgados Cadastrados</h2>
        <div class="filtro-salgados" role="group" aria-label="Filtrar salgados por situação">
            <button type="button" id="btn-salgados-ativos" class="btn-salgados ativo-selecionado" aria-pressed="true">Ativos</button>
            <button type="button" id="btn-salgados-inativos" class="btn-salgados" aria-pressed="false">Inativos</button>
        </div>
    </div>

    <form id="form-busca-salgados" class="busca-salgados">
        <input type="search" id="busca-salgados" placeholder="Buscar por nome" aria-label="Buscar salgado por nome">
        <button type="submit">Buscar</button>
    </form>

    <div id="lista-salgados">
        <div class="estado">Carregando salgados...</div>
    </div>

    <div id="paginacao-salgados" class="paginacao">
        <button type="button" id="btn-salgados-anterior">Anterior</button>
        <span id="pagina-atual-salgados"></span>
        <button type="button" id="btn-salgados-proximo">Próximo</button>
    </div>
    <hr>
</section>

<section>
    <h2>Cadastro de Salgado</h2>
    <form id="form-salgado" class="form-salgado">
        <fieldset class="salgado-form-grid">
            <div class="salgado-campos">
                <label for="nome-salgado">Nome:</label>
                <input type="text" id="nome-salgado" required>

                <label for="descricao-salgado">Descrição:</label>
                <textarea id="descricao-salgado" rows="3" required></textarea>

                <div class="salgado-valores-grid">
                    <div>
                        <label for="categoria-salgado">Categoria:</label>
                        <select id="categoria-salgado" required>
                            <option value="">Carregando...</option>
                        </select>
                    </div>
                    <div>
                        <label for="preco-congelado-salgado">Preço do cento congelado:</label>
                        <input type="number" id="preco-congelado-salgado" min="0" step="0.01" required>

                        <label for="preco-processado-salgado">Preço do cento frito/assado:</label>
                        <input type="number" id="preco-processado-salgado" min="0" step="0.01" required>
                    </div>
                </div>
            </div>

            <div class="salgado-imagem-campo">
                <label for="imagem-salgado">Imagem:</label>
                <label class="seletor-imagem" for="imagem-salgado">
                    <img id="preview-imagem-salgado" src="imagens/coxinha.jpg" alt="Imagem padrão do salgado">
                    <span>Selecionar imagem</span>
                </label>
                <input class="input-imagem" type="file" id="imagem-salgado" accept="image/*">
                <small>A imagem é apenas uma prévia local por enquanto.</small>
            </div>
        </fieldset>
        <button type="submit">Cadastrar Salgado</button>
    </form>
</section>
