<div class="card" data-salgado-id>
    <img class="imagem-salgado" src="imagens/coxinha.jpg" alt="Imagem do salgado">
    <div class="card-info">
        <h2 class="salgado-nome-card"></h2>
        <p class="salgado-descricao-card"></p>
        <p class="salgado-congelado-card"></p>
        <p class="salgado-processado-card"></p>
    </div>
    <div class="card-controles-salgado">
        <div class="card-indicadores-salgado">
            <div class="indicador-linha"><span class="status"></span></div>
            <div class="indicador-linha">
                <span class="estoque-card" title="Quantidade em estoque">
                    <strong></strong>
                    <small>estoque</small>
                </span>
            </div>
        </div>
        <div class="card-acoes-salgado">
            <button type="button" class="btn btn-secundario btn-alterarStatus" data-acao-salgado="status"></button>
            <button type="button" class="btn btn-secundario btn-exibir" data-acao-salgado="exibir">Exibir</button>
            <button type="button" class="btn btn-secundario btn-estoque" data-acao-salgado="estoque">Atualizar Estoque</button>
            <button type="button" class="btn btn-secundario btn-editar" data-acao-salgado="editar">Editar</button>
        </div>
    </div>
</div>
