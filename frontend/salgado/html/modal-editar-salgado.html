<form id="form-salgado-edicao" onsubmit="event.preventDefault(); editarSalgado();">
    <input type="hidden" id="salgado-id-edicao" name="salgadoId">
    <fieldset>
        <div class="salgado-grid">
            <div class="salgado-coluna">
                <label for="nome-salgado-edicao">Nome:</label>
                <input type="text" id="nome-salgado-edicao" name="nome" required>

                <label for="descricao-salgado-edicao">Descrição:</label>
                <textarea id="descricao-salgado-edicao" name="descricao" required></textarea>

                <label for="categoria-salgado-edicao">Categoria:</label>
                <select id="categoria-salgado-edicao" name="categoria" required>
                    <option value="">Selecione</option>
                </select>

                <label for="preco-congelado-salgado-edicao">Preço do cento congelado:</label>
                <input type="number" id="preco-congelado-salgado-edicao" name="precoCentoCongelado" min="0" step="0.01" required>

                <label for="preco-processado-salgado-edicao">Preço do cento frito/assado:</label>
                <input type="number" id="preco-processado-salgado-edicao" name="precoCentoProcessado" min="0" step="0.01" required>
            </div>

            <div class="salgado-coluna imagem-coluna">
                <label for="imagem-salgado-edicao">Imagem:</label>
                <img id="imagem-preview-salgado-edicao" class="imagem-salgado" src="imagens/coxinha.jpg" alt="Imagem do salgado">
                <input type="file" id="imagem-salgado-edicao" name="imagem" accept="image/*">
            </div>
        </div>
    </fieldset>
    <br>

    <button type="submit">Concluir Edição</button>
</form>
