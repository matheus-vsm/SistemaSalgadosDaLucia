<h1>Área de Clientes</h1>
<hr>
<section class="listagem-clientes">
    <div class="clientes-cabecalho">
        <h2>Clientes Cadastrados</h2>
        <div class="filtro-clientes" role="group" aria-label="Filtrar clientes por situação">
            <button type="button" id="btn-clientes-ativos" class="btn-clientes ativo-selecionado" aria-pressed="true">Ativos</button>
            <button type="button" id="btn-clientes-inativos" class="btn-clientes" aria-pressed="false">Inativos</button>
        </div>
    </div>
    <form id="form-busca-clientes" class="busca-clientes">
        <input type="search" id="busca-clientes" placeholder="Buscar por nome" aria-label="Buscar cliente por nome">
        <button type="submit">Buscar</button>
    </form>
    <div class="container">
        <div id="lista">
            <div class="estado" id="estado-inicial">Carregando clientes...</div>
        </div>
    </div>

    <div id="paginacao-clientes" class="paginacao">
        <button id="btn-anterior">Anterior</button>
        <span id="pagina-atual"></span>
        <button id="btn-proximo">Próximo</button>
    </div>

    <hr>
</section>

<section>
    <h2 id="titulo-form-cliente">Cadastro de Cliente</h2>
    <form id="form-cliente">
        <fieldset>
            <div class="cliente-dados-grid">
                <div>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div>
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" maxlength="11" required>
                </div>
            </div>

            <fieldset>
                <legend>Endereço</legend>

                <div class="endereco-grid">
                    <div class="endereco-coluna">
                        <label for="cep">CEP:</label>
                        <input type="text" id="cep" name="cep" maxlength="8" required>

                        <label for="logradouro">Logradouro:</label>
                        <input type="text" id="logradouro" name="logradouro" readonly="true" tabindex="-1" required>

                        <label for="bairro">Bairro:</label>
                        <input type="text" id="bairro" name="bairro" readonly="true" tabindex="-1" required>
                    </div>

                    <div class="endereco-coluna">
                        <label for="numero">Número:</label>
                        <input type="text" id="numero" name="numero" required>

                        <label for="cidade">Cidade:</label>
                        <input type="text" id="cidade" name="cidade" readonly="true" tabindex="-1" required>
                    </div>

                    <div class="endereco-coluna">
                        <label for="complemento">Complemento:</label>
                        <input type="text" id="complemento" name="complemento">

                        <label for="uf">UF:</label>
                        <input type="text" id="uf" name="uf" maxlength="2" readonly="true" tabindex="-1" required>
                    </div>
                </div>
            </fieldset>
        </fieldset>
        <br>

        <button type="submit" class="btn btn-primario">Cadastrar Cliente</button>
        <button type="button" id="cancelar-edicao-cliente" class="btn btn-secundario hidden">Cancelar edição</button>
    </form>
</section>
