<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salgados da Lúcia Kojima</title>
    <link rel="stylesheet" href="style.css">
    <script src="js/api.js" defer></script>
    <script src="js/modal.js" defer></script>
    <script src="js/viacep.js" defer></script>
    <script src="app.js" defer></script>
</head>

<body>

<!-- 1. TELA DE LOGIN (Aparece primeiro) -->
<section id="tela-login" class="login-container">
    <div class="card-login">
        <img class="login-logo" src="imagens/logo.jpg" alt="Logo">
        <h2>Login</h2>
        <form id="form-login">
            <input type="text" id="usuario" placeholder="Usuário" required>
            <input type="password" id="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</section>

<!-- 2. PAINEL DO SISTEMA (Fica escondido até o login) -->
<div id="painel-sistema" class="hidden">

    <header>
        <a class="brand" href="#inicio" aria-label="Salgados da Lúcia Kojima - início">
            <img class="brand-logo" src="imagens/logo.jpg" alt="Logo Salgados da Lúcia Kojima">
            <span>Salgados da Lúcia Kojima</span>
        </a>
        <nav class="social-links" aria-label="Redes sociais">
            <a href="https://www.instagram.com/salgadosdaluciakojima/" target="_blank" rel="noopener noreferrer" aria-label="Abrir Instagram em uma nova guia">
                <img src="imagens/ig.png" alt="Instagram">
            </a>
            <a href="https://api.whatsapp.com/send?phone=5511992439032&amp;utm_source=ig&amp;utm_medium=social&amp;utm_content=link_in_bio&amp;fbclid=PAcGRvZgJleHRuA2FlbQIxMQBzcnRjBmFwcF9pZA85MzY2MTk3NDMzOTI0NTkAAad8Kwb7Kzk6q1rU9ABBiT55kSGrFLi761i3remTQuxM998G2iJJN-lAuwW0Ag_aem_kPSdTJ3gOoj3Qrzk8y5C8w" target="_blank" rel="noopener noreferrer" aria-label="Abrir WhatsApp em uma nova guia">
                <img src="imagens/wpp.png" alt="WhatsApp">
            </a>
        </nav>
    </header>

    <div class="layout-container">
        <aside class="sidebar">
            <nav>
                <a class="nav-link active" data-module="inicio" href="#">Início</a>
                <a class="nav-link" data-module="pedido" href="#">Pedidos</a>
                <a class="nav-link" data-module="salgado" href="#">Salgados</a>
                <a class="nav-link" data-module="cliente" href="#">Clientes</a>
                <a class="nav-link" data-module="compra" href="#">Compras</a>
                <a class="nav-link" data-module="estoque" href="#">Estoque</a>
                <a class="nav-link" data-module="usuario" href="#">Usuários</a>
            </nav>
        </aside>

        <main class="content">
            <section id="conteudo-dinamico" class="page-section">
                <h1>Bem-vindo ao Painel</h1>
            </section>
        </main>
    </div>

</div>

<!-- Modal reutilizável para todas as telas -->
<div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-titulo"></h2>
            <button id="modal-fechar" type="button" class="modal-fechar" aria-label="Fechar">&times;</button>
        </div>
        <div id="modal-corpo" class="modal-corpo"></div>
    </div>
</div>

</body>
</html>
