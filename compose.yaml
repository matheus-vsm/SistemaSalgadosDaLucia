name: salgados-lucia

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME_SALGADOS_MYSQL:?Defina DB_NAME_SALGADOS_MYSQL}
      MYSQL_USER: ${DB_USER_MYSQL:?Defina DB_USER_MYSQL}
      MYSQL_PASSWORD: ${DB_PASSWORD_MYSQL:?Defina DB_PASSWORD_MYSQL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-salgados-backend:local}
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME_SALGADOS_MYSQL: ${DB_NAME_SALGADOS_MYSQL:?Defina DB_NAME_SALGADOS_MYSQL}
      DB_USER_MYSQL: ${DB_USER_MYSQL:?Defina DB_USER_MYSQL}
      DB_PASSWORD_MYSQL: ${DB_PASSWORD_MYSQL:?Defina DB_PASSWORD_MYSQL}
      JWT_HMAC256_SECRET: ${JWT_HMAC256_SECRET:?Defina JWT_HMAC256_SECRET}
      JWT_ISSUER_SALGADOS_DA_LUCIA: ${JWT_ISSUER_SALGADOS_DA_LUCIA:?Defina JWT_ISSUER_SALGADOS_DA_LUCIA}
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    networks: [web, database]
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE:-salgados-frontend:local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5500}:80"
    depends_on:
      backend:
        condition: service_started
    networks: [web]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

networks:
  web:
  database:
    internal: true

volumes:
  mysql-data:
