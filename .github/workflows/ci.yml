name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: chmod +x backend/mvnw && ./backend/mvnw -f backend/pom.xml -B verify
      - run: node --test frontend/tests/*.test.cjs
      - name: Validate shell scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          find infra -name '*.sh' -print0 | xargs -0 -r shellcheck
      - run: bash infra/tests/deploy-guards.sh

  integration:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Isolated stack and real HTTP tests
        shell: bash
        run: |
          python3 infra/tests/create-ci-env.py .env.ci
          set -a
          source .env.ci
          set +a
          docker compose --env-file .env.ci -p salgados-ci up -d --build --wait --wait-timeout 240
          docker compose --env-file .env.ci -p salgados-ci run --rm --no-deps \
            -e SPRING_PROFILES_ACTIVE=prod,bootstrap-admin \
            -e BOOTSTRAP_ADMIN_NAME -e BOOTSTRAP_ADMIN_USERNAME -e BOOTSTRAP_ADMIN_PASSWORD backend
          node --test infra/tests/*.test.cjs
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file .env.ci -p salgados-ci logs --no-color --tail 80
      - name: Remove disposable CI stack
        if: always()
        run: docker compose --env-file .env.ci -p salgados-ci down --volumes
